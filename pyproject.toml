[project]
name = "rclone-autosync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iimarky1234", email = "trietn32@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
]

[project.scripts]
rasync = "rclone_autosync.cli:main"
rclone-autosync = "rclone_autosync.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
